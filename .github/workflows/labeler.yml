name: labeler

# Fork pull_request events only receive a read-only token, so they cannot
# apply labels. pull_request_target runs this file from the base branch
# with a token that can label. Do not check out the pull request head and
# do not run code from it: untrusted PR content must not execute with this
# token. actions/labeler reads the changed-file list and .github/labeler.yml
# from the base repository through the GitHub API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  labeler:
    name: label pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false
          dot: true
